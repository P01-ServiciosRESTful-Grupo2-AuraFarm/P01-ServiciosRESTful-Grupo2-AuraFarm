
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurafarm-db
    environment:
      POSTGRES_DB: aurafarm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aurafarmer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: